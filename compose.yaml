name: ${CONTAINER_NAME:-nas-agent}

services:
  agent:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        INSTALL_CHROMIUM: ${INSTALL_CHROMIUM:-true}
    image: ${CONTAINER_NAME:-nas-agent}:local
    container_name: ${CONTAINER_NAME:-nas-agent}
    hostname: ${CONTAINER_NAME:-nas-agent}
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      TZ: ${TZ:-UTC}
      SSH_AUTHORIZED_KEYS: ${SSH_AUTHORIZED_KEYS:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      RC_PREFIX: ${RC_PREFIX:-nas}
      RC_SPAWN: ${RC_SPAWN:-same-dir}
      RC_CAPACITY: ${RC_CAPACITY:-8}
      INSTALL_CODEX: ${INSTALL_CODEX:-true}
      INSTALL_WRANGLER: ${INSTALL_WRANGLER:-true}
      INSTALL_GCLOUD: ${INSTALL_GCLOUD:-true}
      INSTALL_FIREBASE: ${INSTALL_FIREBASE:-true}
      FIREBASE_MCP: ${FIREBASE_MCP:-false}
    ports:
      - "${SSH_BIND_IP:-0.0.0.0}:${SSH_PORT:-2222}:2222"
    volumes:
      - ${DATA_DIR:?set DATA_DIR in .env}:/data
      # Projects. Defaults to DATA_DIR/workspace; set WORKSPACE_DIR to share one
      # projects folder between several instances. The folder must already exist.
      - type: bind
        source: ${WORKSPACE_DIR:-${DATA_DIR}/workspace}
        target: /data/workspace
        bind:
          create_host_path: false
    # Hardening: no Docker socket, no capabilities, read-only image filesystem.
    read_only: true
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    tmpfs:
      - /tmp:exec,mode=1777,size=2g
      - /var/tmp:mode=1777,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Optional resource limits:
    # mem_limit: 6g
    # cpus: 3
